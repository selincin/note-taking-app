<div class="app-shell flex h-screen">
  @if (isHandset$ | async) {
    <app-bottom-nav [items]="navItems" />
  } @else {
    <app-sidebar-nav [items]="navItems" />
  }

  <div class="flex flex-col w-full">
    @if(!(isHandset$ | async)) {
       <app-header />
    }
    <main class="content overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
